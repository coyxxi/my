<!DOCTYPE html>
<html lang="ko" data-layout="a1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업 공간">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131922" media="(prefers-color-scheme: dark)">
<title>나의 작업 공간</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--bg:#EBEEE8;--surface:#F6F7F3;--ink:#222824;--muted:#6A706A;--line:#D0D6CC;--accent:#3B5B4B;--on-accent:#FFFFFF;--soft:#DDE6DF;--accent2:#9A3B2A;--field:#F6F7F3;--font:"Noto Sans KR",system-ui,-apple-system,sans-serif;--head:"Noto Serif KR","Apple SD Gothic Neo",serif;--num:"Noto Serif KR",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#151917;--surface:#1C211E;--ink:#E3E6E0;--muted:#979D96;--line:#323A35;--accent:#8DB49F;--on-accent:#0F1A14;--soft:#22302A;--accent2:#D77A62;--field:#151917;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font-family:var(--head);font-weight:600;font-size:16px;padding:0 10px 20px;white-space:nowrap}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);cursor:pointer;font-size:14px;white-space:nowrap}
.nav:hover{color:var(--ink)}
.nav[aria-current="page"]{color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--accent)}
.nav.add{color:var(--accent);font-size:13px;margin-top:6px}
.side .sp{margin-top:auto}
main{padding:24px clamp(16px,4vw,44px) 110px;min-width:0}
.wrap{max-width:1060px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pagehead{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.vlabel{writing-mode:vertical-rl;font-family:var(--head);font-size:22px;letter-spacing:.25em;color:var(--accent);border-right:1px solid var(--line);padding-right:14px;line-height:1;min-height:92px}
.pagehead .grow{flex:1;min-width:0}
h1{font-family:var(--head);font-size:clamp(24px,3vw,30px);font-weight:600;margin:0 0 4px;letter-spacing:-.01em;line-height:1.3}
h2{font-family:var(--head);font-size:16px;font-weight:600;margin:0}
h3{font-family:var(--head);font-size:15px;font-weight:600;margin:18px 0 6px}
.lead{color:var(--muted);margin:0;max-width:60ch}
.small{font-size:13px;color:var(--muted)}
.hero{display:flex;align-items:stretch;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:12px}
.hero-main{flex:1;padding:20px 24px 20px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-title{font-family:var(--head);font-size:21px;font-weight:600;margin:0}
.hero-stub{padding:20px 0 20px 24px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.dnum{font-family:var(--num);font-size:50px;font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 24px;font-size:13px;color:var(--muted)}
.keys b{font-family:var(--num);color:var(--accent);font-weight:500;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px 26px}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}
.stack{display:grid;gap:22px;align-content:start}
.panel{border-top:1px solid var(--ink);padding:14px 0 8px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:28px}
.ph h2{flex:1}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 26px}
.blocks .wide{grid-column:1/-1}
.week{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:4px;margin-bottom:14px}
.day{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:8px 0 6px;border:1px solid transparent}
.day .wd{font-size:12px;color:var(--muted);display:block}
.day .dn{font-family:var(--num);font-size:17px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.day .dots{height:8px;display:flex;gap:3px;justify-content:center;align-items:center}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.day.is-today .dn{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--soft);border-color:var(--line)}
.wkbtn{all:unset;cursor:pointer;padding:0 6px;color:var(--muted);font-size:20px;display:flex;align-items:center}
.list{list-style:none;margin:0;padding:0}
.todo,.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row{align-items:flex-start}
.todo:first-child,.row:first-child{border-top:0}
.todo .t{flex:1;min-width:0}
.done .t,.row.done .rowmain span{color:var(--muted);text-decoration:line-through}
.rowmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowact{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.check{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;line-height:1}
.check[aria-pressed="true"]{border-color:var(--accent2);color:var(--accent2);font-family:var(--head);font-size:11px;font-weight:600;transform:rotate(-10deg)}
.check[aria-pressed="true"]::after{content:"済"}
.tag{font-size:12px;color:var(--accent);border:1px solid var(--line);padding:1px 8px;white-space:nowrap}
.icon{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1;opacity:.6}
.icon:hover{opacity:1}
.icon[disabled]{opacity:.2;pointer-events:none}
input,select,textarea{background:var(--field);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0;border-radius:0}
textarea{min-height:110px;resize:vertical}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}.addrow select{width:auto;max-width:40%}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--accent);color:var(--on-accent);padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent2);border:1px solid var(--line)}
.link{all:unset;cursor:pointer;font-size:13px;color:var(--accent);white-space:nowrap}
.link:hover{text-decoration:underline}
.chip{all:unset;cursor:pointer;font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap;text-decoration:none}
.chip[aria-pressed="true"],.chip.st-2{background:var(--soft);color:var(--accent);border-color:transparent}
.chip.st-1{color:var(--accent);border-color:var(--accent)}
.adder{margin-top:12px}
.adder summary{cursor:pointer;color:var(--accent);font-size:14px;list-style:none;display:inline-block}
.adder summary::-webkit-details-marker{display:none}
.adder form,.fgrid{display:grid;gap:10px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.w{grid-column:1/-1}
.adder .btn,.fgrid .btn{grid-column:1/-1;justify-self:start}
.pre{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:2px}
.clip{max-height:4.9em;overflow:hidden}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.bar{height:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.prog{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.prog .n{text-align:right;color:var(--muted);font-family:var(--num);font-size:13px}
.goal{padding:14px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:0}
.goal-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:baseline}
.ms{list-style:none;margin:12px 0 10px;padding:0;display:flex;flex-direction:column;gap:7px}
.ms li{display:grid;grid-template-columns:22px 1fr auto auto auto;gap:10px;align-items:center;font-size:14px}
.ms li.done .mtitle{color:var(--muted);text-decoration:line-through}
.inline{display:flex;gap:6px}
.inline input[type="date"]{width:150px;flex:none}
.up{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.up:first-child{border-top:0}
.up .d{font-family:var(--num);color:var(--accent);font-size:13px;text-align:right}
.stat{font-family:var(--num);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.acc{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.acc .num{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right}
.acc .bar{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:0 0 18px}
.chapters{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:26px}
.chap{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;position:relative}
.chap:last-child{border-right:0}
.chap .ct{font-family:var(--head);font-weight:600;font-size:15px}
.chap.now .ct{color:var(--accent)}
.chap[aria-pressed="true"]{background:var(--soft)}
.chap .bar{margin-top:6px}
.tl{border-left:1px solid var(--line);margin-left:5px}
.tl .chap{border-right:0;padding:10px 12px 10px 20px;width:100%}
.tl .chap::before{content:"";position:absolute;left:-5px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--muted)}
.tl .chap.now::before{background:var(--accent);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 26px}
.card{all:unset;box-sizing:border-box;cursor:pointer;border-top:1px solid var(--ink);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.card .cn{font-family:var(--head);font-size:18px;font-weight:600}
.card .cj{font-family:var(--head);color:var(--accent);font-size:13px;letter-spacing:.15em}
.card:hover .cn{color:var(--accent)}
.card.new{color:var(--accent);justify-content:center;min-height:120px;border-top-style:dashed}
.edit-on .panel{outline:1px dashed var(--line);outline-offset:6px}
.bt{font-family:var(--head);font-weight:600;font-size:15px;padding:4px 8px;flex:1}
.erow{display:grid;grid-template-columns:1fr 150px auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow.chapf{grid-template-columns:1fr 140px 140px}
.erow .acts{display:flex;gap:6px;justify-content:flex-end;grid-column:1/-1}
.tblk{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tblk input{flex:1}
.tblk .tag{flex:none}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:26px;padding-top:16px;border-top:1px solid var(--ink)}
.foot form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.foot select,.foot input{width:auto}
dialog{border:0;border-top:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:22px 24px;width:min(600px,calc(100vw - 24px));max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(18,24,20,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync[data-s="ok"]::before{background:var(--accent)}
.sync[data-s="err"]::before,.sync[data-s="off"]::before{background:var(--accent2)}
#loginMsg{min-height:1.4em;color:var(--accent2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
html[data-layout="c"] .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
html[data-layout="c"] .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:2px;border-right:0;border-bottom:1px solid var(--ink);padding:10px clamp(16px,4vw,44px);background:var(--bg);z-index:10;overflow-x:auto}
html[data-layout="c"] .brand{padding:0 16px 0 0}
html[data-layout="c"] .nav{flex:none}
html[data-layout="c"] .nav[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
html[data-layout="c"] .nav.add{margin:0}
html[data-layout="c"] .side .sp{margin:0 0 0 auto}
.tline{border-top:1px solid var(--ink);padding-top:12px;margin-bottom:26px}
.segs{display:flex;overflow-x:auto}
.seg2{all:unset;box-sizing:border-box;cursor:pointer;min-width:120px;padding:2px 10px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.seg2:first-child{border-left:0;padding-left:0}
.seg2 .ct{font-family:var(--head);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg2 .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg2.now .ct{color:var(--accent)}
.seg2[aria-pressed="true"] .ct{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.track{position:relative;height:4px;background:var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.track .marker{position:absolute;top:-6px;width:2px;height:16px;background:var(--accent2)}
.tline .tl-foot{display:flex;justify-content:space-between;margin-top:8px}
.hero.rev{flex-direction:row-reverse}
.hero.rev .hero-stub{align-items:flex-start;padding:20px 24px 20px 0}
.hero.rev .hero-main{align-items:flex-end;text-align:right;padding:20px 0 20px 24px}
.hero.rev .dnum{font-size:60px}
.grp{margin:14px 0 2px;font-size:13px;color:var(--accent);font-family:var(--head);font-weight:600}
.grp:first-child{margin-top:0}
@media (max-width:760px){.hero.rev{flex-direction:column}.hero.rev .hero-main{align-items:flex-start;text-align:left;padding:0 0 16px}.hero.rev .hero-stub{padding:18px 0 8px}}
.tabbar,.fab{display:none}
.sheet-list{display:flex;flex-direction:column}
.sheet-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:14px 2px;border-top:1px solid var(--line);font-size:16px}
.sheet-item:first-child{border-top:0}
.sheet-item .jp{font-family:var(--head);color:var(--accent);font-size:13px;letter-spacing:.15em}
.sheet-item[aria-current="page"]{color:var(--accent);font-weight:500}
@media (min-width:761px) and (max-width:1180px){
  .app{grid-template-columns:172px minmax(0,1fr)}
  .side{padding:22px 10px}
  main{padding:20px 24px 60px}
  .grid{gap:20px 22px}
}
@media (min-width:761px) and (max-width:1023px){.blocks{grid-template-columns:1fr}}
@media (pointer:coarse){
  .nav{padding:11px 10px}
  .todo{min-height:50px}
  .icon{padding:8px 9px}
  .chip{padding:5px 11px}
  .day{padding:10px 0 8px}
  input,select,textarea{font-size:16px}
}
@media (max-width:760px){
  .side{display:none}
  .app{display:block}
  main{padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--ink);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
  .tab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:8px 0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab[aria-current="page"]{color:var(--accent);font-weight:500}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;font-size:28px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  input,select,textarea{font-size:16px}
  .topbar{margin-bottom:14px}
  .hero{align-items:center}
  .hero-main{padding:14px 12px 14px 0;gap:2px}
  .hero-title{font-size:18px}
  .hero-stub{padding:14px 0}
  .dnum{font-size:38px}
  .keys{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;margin-bottom:18px;scrollbar-width:none}
  .keys::-webkit-scrollbar,.chapters::-webkit-scrollbar{display:none}
  .chapters{grid-auto-columns:74%;scroll-snap-type:x mandatory;margin-bottom:20px;scrollbar-width:none}
  .chap{scroll-snap-align:start}
  .grid{gap:20px}
  .s7,.s5{grid-column:span 12}
  .blocks{grid-template-columns:1fr;gap:20px}
  .todo{min-height:52px;gap:10px}
  .check{width:26px;height:26px}
  .week{gap:1px}
  .wkbtn{padding:0 2px}
  .addrow{flex-wrap:wrap}
  .addrow input{flex:1 1 100%}
  .addrow select{flex:1;max-width:none}
  .pagehead{gap:12px;flex-wrap:wrap}
  .pagehead .grow{flex:1 1 60%}
  .vlabel{font-size:17px;min-height:60px;padding-right:10px}
  h1{font-size:24px}
  .row{flex-wrap:wrap}
  .rowact{width:100%;justify-content:flex-start;padding-left:0}
  .row .check+.rowmain+.rowact{padding-left:36px}
  .ms li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  .ms li .mtitle{flex:1 1 calc(100% - 40px)}
  .ms li > :nth-child(3){margin-left:36px}
  .ms li > span:empty{display:none}
  .inline{flex-wrap:wrap}.inline input[type="date"]{flex:1}
  .two{gap:12px}
  .stat{font-size:22px}
  .acc{grid-template-columns:1fr auto}
  .acc .num{grid-column:1/2;text-align:left}
  .erow,.erow.chapf{grid-template-columns:1fr}
  .foot{flex-direction:column;align-items:stretch}
  .foot form{flex-direction:column;align-items:stretch}
  .foot select,.foot input{width:100%}
  .chapters + .grid > .s5 > div:last-child{display:none}
  #addTodo{display:none}
  .pagehead .lead{display:none}
  .pagehead{align-items:center}
  .vlabel{min-height:44px}
  dialog{margin:auto 0 0;width:100%;max-width:100%;max-height:88vh;border-radius:16px 16px 0 0;border-top:0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
  dialog::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
}

async function push(){

  const {error}=await sb.from('workspace').upsert({user_id:session.user.id,data:state,updated_at:new Date(state._updated||Date.now()).toISOString()});

}
async function pull(){
  if(!sb||!session||!navigator.onLine){if(session)setSync('off');return}
  const {data:row,error}=await sb.from('workspace').select('data').eq('user_id',session.user.id).maybeSingle();
  if(error){console.error(error);setSync('err');return}
  const linkKey=KEY+'.linked',linked=localStorage.getItem(linkKey)===session.user.id;
  const remote=row&&row.data,rt=(remote&&remote._updated)||0,lt=state._updated||0;
  if(remote&&(!linked||rt>lt)){state=remote;if(!state.v5){migrate(state);save()}else writeLocal();render();if(syncState!=='saving')setSync('ok')}
  else if(!remote||lt>rt){if(!state._updated)state._updated=Date.now();writeLocal();await push()}
  else setSync('ok');
  try{localStorage.setItem(linkKey,session.user.id)}catch(e){}
}

function searchIndex(){
  const R=[],add=(kind,title,sub,text,go)=>R.push({kind,title:String(title||''),sub,text:String(text||''),go});
  state.todos.forEach(t=>add('todo',t.text,`${spName(t.space)} / ${t.date}${t.done?' / 완료':''}`,'',{day:t.date}));
  state.keyDates.forEach(k=>add('etc',k.title,`중요 일정 / ${k.date}`,'',{view:'home'}));
  state.chapters.forEach(c=>add('etc',c.title,`챕터 / ${c.start} ~ ${c.end}`,c.memo,{view:'home'}));
  state.spaces.forEach(sp=>sp.blocks.forEach(b=>{const D=state.data[b.id],P=`${sp.name} › ${b.title}`,go={view:sp.id,block:b.id};if(!D)return;
    switch(b.type){
      case 'goals':D.forEach(g=>{add('goal',g.title,`${P} / ${g.due}까지`,'',go);g.ms.forEach(m=>add('goal',m.title,`${P} / ${g.title} / ${m.date}`,'',go))});break;
      case 'notes':D.forEach(i=>add('note',i.title,`${P} / ${i.date}`,i.body,go));break;
      case 'books':D.forEach(i=>add('note',i.title,`${P} / ${i.author||''} ${i.status||''}`,[i.memo,i.review&&[i.review.line,i.review.quote,i.review.text].join(' ')].join(' '),go));break;
      case 'wins':D.forEach(i=>add('note',`${i.sit} 상황에서 ${i.act}`,`${P} / ${i.date}`,i.res+' '+(i.skill||''),go));break;
      case 'copy':D.forEach(i=>add('note',i.title,P,(i.subject||'')+' '+i.body,go));break;
      case 'info':D.forEach(i=>add('note',i.label,P,i.value,go));break;
      case 'checklist':D.forEach(i=>add('note',i.text,P,'',go));break;
      case 'works':D.forEach(i=>add('file',i.title,P,(i.tool||'')+' '+(i.note||''),go));break;
      case 'links':D.forEach(i=>add('link',i.title,`${P} / ${i.status||'예정'}`,(i.memo||'')+' '+(i.url||''),go));break;
      case 'inbox':D.forEach(e=>add('mail',e.subject,`${P} / ${e.date}${e.from?' / '+e.from:''}`,[e.summary,e.cands.map(c=>c.title).join(' '),e.raw,e.fileName].join(' '),go));break;
      case 'files':(D.items||[]).forEach(i=>add('file',i.name,`${P} / ${i.folder} / ${i.date}`,'',go));break;
      case 'money':(D.accounts||[]).forEach(a=>add('etc',a.name,P,'',go));break;
    }}));
  return R;
}

    case 'delgoal':if(!confirm('이 목표와 중간 목표를 모두 삭제할까요?'))return;state.data[b.id]=data(b).filter(g=>g.id!==id);break;
    case 'ms':{const m=byId(byId(data(b),el.dataset.g).ms,id);m.done=!m.done;break}
    case 'ms2todo':{const m=byId(byId(data(b),el.dataset.g).ms,id);state.todos.push({id:uid(),text:m.title,date:m.date,space:el.dataset.s,done:false});toast(m.date+' 할 일에 추가했어요');break}
    case 'delacc':if(!confirm('이 통장을 삭제할까요?'))return;data(b).accounts=data(b).accounts.filter(x=>x.id!==id);break;
    case 'delcheck':if(!confirm('이 달 기록을 삭제할까요?'))return;data(b).checkins=data(b).checkins.filter(x=>x.id!==id);break;
    case 'edit':ui.edit=!ui.edit;break;
    case 'bmove':{const sp=spaceOf(el.dataset.s);move(sp.blocks,sp.blocks.findIndex(x=>x.id===el.dataset.b),+el.dataset.n);break}
    case 'bdel':{if(!confirm('이 블록과 안의 기록을 삭제할까요?'))return;const sp=spaceOf(el.dataset.s);sp.blocks=sp.blocks.filter(x=>x.id!==el.dataset.b);delete state.data[el.dataset.b];break}
    case 'savetpl':{const sp=spaceOf(el.dataset.s);state.templates.push({id:uid(),name:sp.name+' 구성',blocks:sp.blocks.map(x=>({type:x.type,title:x.title}))});toast('템플릿으로 저장했어요. 관리에서 이름을 바꿀 수 있어요');return}
    case 'delspace':{const sp=spaceOf(el.dataset.s);if(!confirm(`'${sp.name}' 공간과 안의 기록을 모두 삭제할까요?`))return;sp.blocks.forEach(x=>delete state.data[x.id]);state.spaces=state.spaces.filter(x=>x!==sp);state.todos.forEach(t=>{if(t.space===sp.id)t.space=''});if(ui.view===sp.id)ui.view='home';ui.edit=false;break}
    case 'smove':move(state.spaces,state.spaces.findIndex(x=>x.id===el.dataset.s),+el.dataset.n);break;
    case 'tmove':{const t=byId(state.templates,el.dataset.t);move(t.blocks,+el.dataset.i,+el.dataset.n);break}
    case 'tbdel':{const t=byId(state.templates,el.dataset.t);t.blocks.splice(+el.dataset.i,1);break}
    case 'deltpl':if(state.templates.length<=1){toast('템플릿은 하나 이상 있어야 해요');return}if(!confirm('이 템플릿을 삭제할까요? 이미 만든 공간은 그대로예요.'))return;state.templates=state.templates.filter(t=>t.id!==el.dataset.t);break;
    case 'dlg':openDlg(el.dataset.d);return;
    case 'login':openDlg('login');return;
    case 'logout':if(!confirm('로그아웃할까요? 이 기기에 저장된 내용은 남아 있어요.'))return;sb.auth.signOut().then(()=>{session=null;setSync('out');render()});return;
    case 'signup':{const f=document.querySelector('[data-login]');const em=f.elements.email.value.trim(),pw=f.elements.pw.value;if(!em||pw.length<6){loginMsg('이메일과 6자 이상 비밀번호를 먼저 입력하세요.');return}
      loginMsg('');sb.auth.signUp({email:em,password:pw}).then(async({data,error})=>{if(error){loginMsg('계정을 만들지 못했어요: '+error.message);return}if(data.session){session=data.session;dlg.close();await pull();render();toast('계정을 만들었어요')}else loginMsg('확인 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인하세요.')});return}
    case 'closedlg':dlg.close();return;
    case 'keymain':state.keyDates.forEach(k=>k.main=k.id===id);break;
    case 'delkey':state.keyDates=state.keyDates.filter(k=>k.id!==id);break;
    case 'delchap':if(!confirm('이 챕터를 삭제할까요? 중간 목표는 그대로예요.'))return;state.chapters=state.chapters.filter(c=>c.id!==id);break;
    case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='작업공간-백업-'+TODAY+'.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500);toast('백업 파일을 내보냈어요');return}
    case 'import':document.getElementById('importFile').click();return;
    case 'reset':if(!confirm('모든 내용을 지우고 예시 상태로 되돌릴까요? 로그인 중이면 다른 기기에도 반영돼요.'))return;state=migrate(seed());ui.view='home';break;
    default:return;
  }
  save();render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f)),ds=f.dataset;
  if(ds.login){loginMsg('');sb.auth.signInWithPassword({email:fd.email.trim(),password:fd.pw}).then(async({data,error})=>{if(error){loginMsg('로그인하지 못했어요. 이메일과 비밀번호를 확인하세요.');return}session=data.session;dlg.close();await pull();render();toast('로그인했어요')});return}
  if(ds.quick){state.todos.push({id:uid(),text:fd.text.trim(),date:fd.date,space:fd.space,done:false});dlg.close();toast(fd.date===TODAY?'오늘 할 일에 추가했어요':fd.date+' 할 일에 추가했어요');save();render();return}
  if(f.id==='addTodo')state.todos.push({id:uid(),text:fd.text.trim(),date:ui.day,space:fd.space,done:false});
  else if(ds.list){const b=blockOf(ds.list);data(b).unshift({id:uid(),...fd,...(b.type==='links'?{status:'예정'}:{}),...(b.type==='checklist'?{done:false}:{}),...(b.type==='books'?{status:'읽는 중'}:{})});toast('저장했어요')}
  else if(ds.ms){const[bid,gid]=ds.ms.split('|');byId(data(blockOf(bid)),gid).ms.push({id:uid(),title:fd.title.trim(),date:fd.date,done:false})}
  else if(ds.goal)data(blockOf(ds.goal)).push({id:uid(),title:fd.title.trim(),due:fd.due,ms:[]});
  else if(ds.acc)data(blockOf(ds.acc)).accounts.push({id:uid(),name:fd.name.trim(),kind:fd.kind,target:+fd.target||0});
  else if(ds.checkin){const d=data(blockOf(ds.checkin)),bal={};d.accounts.forEach(a=>bal[a.id]=+fd['a_'+a.id]||0);const ex=d.checkins.find(c=>c.month===fd.month);if(ex)ex.bal=bal;else d.checkins.push({id:uid(),month:fd.month,bal});toast(fd.month+' 잔액을 저장했어요')}
  else if(ds.addblock){const sp=spaceOf(ds.addblock);sp.blocks.push({id:uid(),type:fd.type,title:fd.title.trim()||BT[fd.type].name})}
  else if(ds.taddblock){byId(state.templates,ds.taddblock).blocks.push({type:fd.type,title:fd.title.trim()||BT[fd.type].name})}
  else if(ds.addtpl)state.templates.push({id:uid(),name:fd.name.trim(),blocks:[]});
  else if(ds.addspace){const t=byId(state.templates,fd.tpl);const sp={id:uid(),name:fd.name.trim(),jp:'',tpl:fd.tpl||'',blocks:t?t.blocks.map(x=>({id:uid(),type:x.type,title:x.title})):[]};state.spaces.push(sp);ui.view=sp.id;ui.edit=false;dlg.close()}
  else if(ds.key){if(ds.key==='new')state.keyDates.push({id:uid(),title:fd.title.trim(),date:fd.date,main:!state.keyDates.length});else Object.assign(byId(state.keyDates,ds.key),{title:fd.title.trim(),date:fd.date});toast('저장했어요')}
  else if(ds.chap){if(fd.end<fd.start){toast('끝나는 날이 시작일보다 빨라요');return}const v={title:fd.title.trim(),start:fd.start,end:fd.end,memo:fd.memo||''};if(ds.chap==='new')state.chapters.push({id:uid(),...v});else Object.assign(byId(state.chapters,ds.chap),v);toast('저장했어요')}
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.bt){const[sid,bid]=ds.bt.split('|');spaceOf(sid).blocks.find(x=>x.id===bid).title=t.value.trim()||'이름 없음'}
  else if(ds.sname){spaceOf(ds.sname).name=t.value.trim()||'이름 없음'}
  else if(ds.sjp!==undefined&&ds.sjp){spaceOf(ds.sjp).jp=t.value.trim()}
  else if(ds.tn){byId(state.templates,ds.tn).name=t.value.trim()||'이름 없음'}
  else if(ds.tbt){const[tid,i]=ds.tbt.split('|');byId(state.templates,tid).blocks[+i].title=t.value.trim()||'이름 없음'}
  else if(t.id==='importFile'){
    const file=t.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.spaces)||!s.data)throw 0;if(!confirm('지금 내용을 백업 파일 내용으로 바꿀까요?'))return;state=migrate(s);save();ui.view='home';render();toast('불러왔어요')}catch(_){toast('이 파일은 작업 공간 백업 파일이 아니에요')}t.value=''};
    r.readAsText(file);return;
  }
  else return;
  save();render();
});
async function fileMove(bid,id,folder){
  const b=blockOf(bid),sp=state.spaces.find(s=>s.blocks.includes(b)),d=fdata(b),it=byId(d.items,id);if(!it||it.folder===folder)return;
  const old=it.folder;it.folder=folder;save();render();
  if(!it.driveId||!driveConfigured())return;
  try{const to=await folderFor(sp,folder),from=state.drive.folders[sp.id+'/'+old];await gapi(`https://www.googleapis.com/drive/v3/files/${it.driveId}?addParents=${to}${from?'&removeParents='+from:''}&fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'});toast(`Drive에서도 ${folder} 폴더로 옮겼어요`)}
  catch(e){toast('목록은 옮겼지만 Drive 위치는 그대로예요: '+(e.message||e))}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,bid=el.dataset.b,b=bid?blockOf(bid):null;
  switch(a){
    case 'tplsel':ui.tplSel=el.dataset.t;break;
    case 'newtpl':{const t={id:uid(),name:'새 템플릿',blocks:[]};state.templates.push(t);ui.tplSel=t.id;save();break}
    case 'taddblk':{const t=byId(state.templates,el.dataset.t);t.blocks.push({type:el.dataset.type,title:BT[el.dataset.type].name});save();break}
    case 'addblk':{const sp=spaceOf(el.dataset.s);sp.blocks.push({id:uid(),type:el.dataset.type,title:BT[el.dataset.type].name});save();toast(BT[el.dataset.type].name+' 블록을 더했어요');break}
    case 'inrun':inboxRun(bid);return;
    case 'inclear':delete ui.inFile[bid];break;
    case 'indrop':delete ui.drafts[bid];break;
    case 'incand':{const c=ui.drafts[bid].cands[+el.dataset.i];c.on=!c.on;break}
    case 'inaddcand':ui.drafts[bid].cands.push({title:'',due:'',on:true,who:'',kind:'직접 추가'});break;
    case 'insend':inboxSave(bid,el.dataset.s,true);return;
    case 'inkeeponly':inboxSave(bid,el.dataset.s,false);return;
    case 'inmore':ui.keep[bid]=1;break;
    case 'ffolder':ui.ff[bid]=el.dataset.k;break;
    case 'faddfolder':{const n=(prompt('새 폴더 이름')||'').trim();if(!n)return;const d=fdata(b);if(!d.folders.includes(n))d.folders.push(n);ui.ff[bid]=n;save();break}
    case 'fstar':{const d=fdata(b),i=byId(d.items,el.dataset.id);i.star=!i.star;if(i.star)i.pf=Math.max(0,...d.items.filter(x=>x.star&&x!==i).map(x=>x.pf||0))+1;save();break}
    case 'fpf':{const d=fdata(b),pf=d.items.filter(i=>i.star).sort((x,y)=>(x.pf||0)-(y.pf||0));pf.forEach((x,k)=>x.pf=k);const k=pf.findIndex(x=>x.id===el.dataset.id),j=k+(+el.dataset.n);if(k<0||j<0||j>=pf.length)return;pf[k].pf=j;pf[j].pf=k;save();break}
    case 'fdel':{if(!confirm('목록에서 뺄까요? Drive의 원본 파일은 그대로 남아요.'))return;const d=fdata(b);d.items=d.items.filter(i=>i.id!==el.dataset.id);save();break}
    case 'gconnect':getToken().then(()=>toast('Google Drive에 연결했어요')).catch(err=>toast(err.message));return;
    case 'aitest':toast('AI 연결을 확인하는 중…');aiParse('보낸 사람: 테스트\n제목: 연결 확인\n내일까지 자료 공유 부탁드립니다.',null).then(r=>toast('AI 연결 성공: 할 일 '+r.cands.length+'개를 찾았어요')).catch(err=>toast('AI 연결 실패: '+(err.message||err)));return;
    case 'icsmake':{if(state.ics&&state.ics.token&&!confirm('새 주소를 만들면 예전 구독 주소는 더 이상 동작하지 않아요. 계속할까요?'))return;state.ics=Object.assign({keys:true,ms:true,todos:true,chapters:true},state.ics||{},{token:rndToken()});save();break}
    case 'icscopy':copy(icsUrl());return;
    case 'sfilter':ui.sk=el.dataset.k;ui.sact=0;renderSearch();return;
    case 'sgo':searchGo(+el.dataset.i);return;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.infile){ui.inFile[ds.infile]=t.files[0]||null;render();return}
  if(ds.inmode){ui.inMode[ds.inmode]=t.value;return}
  if(ds.inkeep){if(ui.drafts[ds.inkeep])ui.drafts[ds.inkeep].keepFile=t.checked;return}
  if(ds.cand){const[bid,i,k]=ds.cand.split('|');if(ui.drafts[bid])ui.drafts[bid].cands[+i][k]=t.value;return}
  if(ds.fup){const fl=Array.from(t.files||[]);t.value='';filesUpload(ds.fup,fl);return}
  if(ds.fmove){const[bid,id]=ds.fmove.split('|');fileMove(bid,id,t.value);return}
  if(ds.icsopt){state.ics[ds.icsopt]=t.checked;save();return}
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.intext){ui.inText[ds.intext]=t.value;return}
  if(ds.cand){const[bid,i,k]=ds.cand.split('|');if(ui.drafts[bid])ui.drafts[bid].cands[+i][k]=t.value;return}
  if(t.id==='sq'){ui.sq=t.value;ui.sact=0;renderSearch()}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openDlg('search');return}
  if(ui.dlg==='search'&&e.target.id==='sq'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=ui.sres.length;if(!n)return;ui.sact=(ui.sact+(e.key==='ArrowDown'?1:-1)+n)%n;renderSearch();const x=document.querySelector('.sres.act');if(x)x.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();searchGo(ui.sact)}
  }
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');const fl=Array.from(e.dataTransfer.files||[]);if(!fl.length)return;if(z.dataset.drop==='files')filesUpload(z.dataset.b,fl);else{ui.inFile[z.dataset.b]=fl[0];render()}});
dlg.addEventListener('close',()=>dlg.classList.remove('wide'));


document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='eopen'){ui.editing=el.dataset.k;render();const f=document.querySelector('.editing input, .editing textarea');if(f){f.focus();if(f.select)f.select()}return}
  if(a==='ecancel'){ui.editing=null;render();return}
  if(a==='review'){ui.rv={bid:el.dataset.b,id:el.dataset.id};openDlg('review');return}
  if(a==='msdel'){if(!confirm('이 중간 목표를 삭제할까요?'))return;const g=byId(data(blockOf(el.dataset.b)),el.dataset.g);g.ms=g.ms.filter(m=>m.id!==el.dataset.id);ui.editing=null;save();render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.editing&&!ui.dlg){ui.editing=null;render()}});
document.addEventListener('submit',e=>{
  const f=e.target,ds=f.dataset;if(!(ds.edit||ds.gedit||ds.medit||ds.tedit||ds.review))return;
  e.preventDefault();const fd=Object.fromEntries(new FormData(f)),T=v=>typeof v==='string'?v.trim():v;
  if(ds.edit){const[bid,id]=ds.edit.split('|');const it=byId(data(blockOf(bid)),id);if(it)Object.keys(fd).forEach(k=>it[k]=T(fd[k]))}
  else if(ds.gedit){const[bid,gid]=ds.gedit.split('|');const g=byId(data(blockOf(bid)),gid);g.title=T(fd.title);g.due=fd.due}
  else if(ds.medit){const[bid,gid,mid]=ds.medit.split('|');const m=byId(byId(data(blockOf(bid)),gid).ms,mid);m.title=T(fd.title);m.date=fd.date}
  else if(ds.tedit){const t=byId(state.todos,ds.tedit);t.text=T(fd.text);t.date=fd.date;t.space=fd.space}
  else if(ds.review){const bk=byId(data(blockOf(ui.rv.bid)),ui.rv.id);bk.review={stars:+fd.stars||0,line:T(fd.line||''),quote:T(fd.quote||''),text:T(fd.text||''),date:TODAY};bk.end=fd.end||bk.end;bk.status='다 읽음';dlg.close()}
  ui.editing=null;save();render();toast('저장했어요');
});
render();
initSync();
</script>
</body>
